<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Anchor Tag Targets</title></head>
<body>
    <h1>Anchor Tag and Target Values</h1>
    <p><a href="https://www.google.com" target="_blank">Open Google in a new tab (_blank)</a></p>
    <p><a href="home.html" target="_self">Open a page in the same frame (_self)</a></p>
    <p>Other target values: <code>_parent</code>, <code>_top</code>, and a named frame such as <code>myframe</code>.</p>
    <p>Named-frame example: <a href="https://example.com" target="myframe">Open in the named frame</a></p>
    <iframe name="myframe" title="Named frame example" width="500" height="200"></iframe>
    <p><a href="../home.html">Back to Home</a></p>
</body>
</html>
