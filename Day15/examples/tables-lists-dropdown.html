<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Tables, Lists, and Dropdowns</title></head>
<body>
    <h1>Tables, Lists, and Dropdowns</h1>
    <h2>Table</h2>
    <table border="1" width="60%" cellpadding="8">
        <tr><th colspan="3">Student Details</th></tr>
        <tr><th>Name</th><th>Course</th><th>Year</th></tr>
        <tr><td>Baskar</td><td>CSE</td><td>IV</td></tr>
        <tr><td>Arun</td><td>IT</td><td>III</td></tr>
    </table>
    <h2>Ordered List</h2>
    <ol><li>Learn HTML</li><li>Practise forms</li><li>Build a website</li></ol>
    <h2>Unordered List</h2>
    <ul><li>HTML</li><li>CSS</li><li>JavaScript</li></ul>
    <h2>Dropdown</h2>
    <label for="city">Choose a city:</label>
    <select id="city" name="city">
        <option value="">Select city</option><option value="chennai">Chennai</option>
        <option value="villupuram">Villupuram</option><option value="madurai">Madurai</option>
    </select>
    <p><a href="../home.html">Back to Home</a></p>
</body>
</html>
