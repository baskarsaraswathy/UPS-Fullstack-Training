<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Video and Audio</title></head>
<body>
    <h1>HTML Video and Audio</h1>
    <h2>Video</h2>
    <video width="400" controls muted loop>
        <source src="sample-video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <h2>Audio</h2>
    <audio controls>
        <source src="sample-audio.mp3" type="audio/mpeg">
        Your browser does not support the audio tag.
    </audio>
    <h2>YouTube Video</h2>
    <p>Replace VIDEO_ID with a real YouTube video ID.</p>
    <iframe width="400" height="225" src="https://www.youtube.com/embed/VIDEO_ID" title="YouTube video" allowfullscreen></iframe>
    <p>Put your own sample-video.mp4 and sample-audio.mp3 files in this examples folder to test local media.</p>
    <p><a href="../home.html">Back to Home</a></p>
</body>
</html>
