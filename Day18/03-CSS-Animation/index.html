<!DOCTYPE html>
<html>
<head>
    <title>CSS Animation</title>
    <style>
        .circle {
            width: 100px;
            height: 100px;
            background-color: red;
            border-radius: 100px;
            position: absolute;
            animation: mymove 5s infinite;
        }

        @keyframes mymove {
            0% {
                background-color: red;
                left: 0px;
                top: 100px;
            }

            25% {
                background-color: yellow;
                left: 200px;
                top: 0px;
            }

            50% {
                background-color: blue;
                left: 200px;
                top: 200px;
            }

            75% {
                background-color: green;
                left: 0px;
                top: 200px;
            }

            100% {
                background-color: red;
                left: 0px;
                top: 100px;
            }
        }
    </style>
</head>
<body>
    <h1>CSS Animation</h1>
    <div class="circle"></div>
</body>
</html>
