<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Combinators</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="parent">
        <p>Child paragraph</p>
        <section><p>Descendant paragraph</p></section>
    </div>
    <h2>Heading</h2>
    <p>Adjacent sibling paragraph</p>
    <p>General sibling paragraph</p>
</body>
</html>
